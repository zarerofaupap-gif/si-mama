<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Si MAMA — Policy Brief</title>
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar contour-bg">
    <div class="brand"><span class="brand-mark">Si MAMA</span></div>
    <div class="brand-sub">Papua Pegunungan</div>

    <a class="nav-link" href="dashboard.html">Dashboard</a>
    <a class="nav-link" href="aspirasi.html">Aspirasi</a>
    <a class="nav-link" href="isu.html">Isu Strategis</a>
    <a class="nav-link" href="kabupaten.html">Data Kabupaten</a>
    <a class="nav-link active" href="policy-brief.html">Policy Brief</a>
    <a class="nav-link" href="stakeholder.html">Stakeholder</a>
    <a class="nav-link" href="arsip.html">Arsip Dokumen</a>

    <div class="nav-section-label">Akun</div>
    <div id="user-badge" style="padding:10px 12px;"></div>
    <a class="nav-link" href="#" onclick="signOut(); return false;">Keluar</a>

    <div class="sidebar-footer">Regional Intelligence Desk</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Policy Brief</h1>
        <div class="subtitle">Kajian singkat isu strategis Papua Pegunungan — target 2 brief/bulan.</div>
      </div>
      <button class="btn btn-primary" id="btn-new" data-role="admin,research_officer">
        + Kajian Baru
      </button>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div class="field" style="margin:0;">
          <label>Status</label>
          <select id="filter-status">
            <option value="">Semua status</option>
            <option value="draft">Draft</option>
            <option value="review">Review</option>
            <option value="terbit">Terbit</option>
          </select>
        </div>
        <div class="field" style="margin:0;">
          <label>Cari judul</label>
          <input type="text" id="filter-search" placeholder="Ketik kata kunci..." />
        </div>
      </div>
    </div>

    <div id="brief-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;">
      <div class="card">Memuat data...</div>
    </div>
  </main>
</div>

<!-- ===== Modal Tambah/Edit Policy Brief ===== -->
<div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(22,40,58,0.45);align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:40px 20px;">
  <div class="card" style="width:640px;max-height:none;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
      <h3 id="modal-title">Kajian Baru</h3>
      <button class="btn btn-outline" style="padding:6px 10px;" onclick="closeModal()">✕</button>
    </div>

    <form id="brief-form">
      <input type="hidden" id="f-id" />

      <div class="field">
        <label>Judul Kajian</label>
        <input type="text" id="f-judul" required placeholder="Mis. Tantangan Akses Pendidikan di Wilayah Pegunungan" />
      </div>

      <div class="field">
        <label>Masalah</label>
        <textarea id="f-masalah" rows="2" placeholder="Apa persoalan yang diangkat?"></textarea>
      </div>
      <div class="field">
        <label>Data Pendukung</label>
        <textarea id="f-data" rows="2" placeholder="Angka, statistik, atau fakta lapangan yang mendukung"></textarea>
      </div>
      <div class="field">
        <label>Analisis</label>
        <textarea id="f-analisis" rows="2" placeholder="Kenapa masalah ini terjadi?"></textarea>
      </div>
      <div class="field">
        <label>Dampak</label>
        <textarea id="f-dampak" rows="2" placeholder="Apa akibatnya bagi masyarakat?"></textarea>
      </div>
      <div class="field">
        <label>Kebijakan yang Ada</label>
        <textarea id="f-kebijakan" rows="2" placeholder="Regulasi/program yang sudah berjalan terkait isu ini"></textarea>
      </div>
      <div class="field">
        <label>Gap</label>
        <textarea id="f-gap" rows="2" placeholder="Apa yang masih kurang dari kebijakan yang ada?"></textarea>
      </div>
      <div class="field">
        <label>Rekomendasi</label>
        <textarea id="f-rekomendasi" rows="2" placeholder="Usulan konkret untuk Senator/pemangku kebijakan"></textarea>
      </div>

      <div class="field">
        <label>Status</label>
        <select id="f-status">
          <option value="draft">Draft</option>
          <option value="review">Review</option>
          <option value="terbit">Terbit</option>
        </select>
      </div>

      <div class="error-text" id="form-error"></div>

      <div style="display:flex;gap:10px;margin-top:8px;">
        <button type="submit" class="btn btn-primary" id="form-submit-btn">Simpan Kajian</button>
        <button type="button" class="btn btn-outline" onclick="closeModal()">Batal</button>
      </div>
    </form>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/policy-brief.js"></script>
</body>
</html>
